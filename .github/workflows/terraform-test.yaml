name: Terraform and OpenTofu tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Temporary integration pin: replace with a durable merged revision before landing.
    uses: miljodir/workflow-templates/.github/workflows/terraform-test.yaml@94ad8ac2d2a0a5a9161a60f40a60dba541954289
    with:
      engine: both
      terraform-version: "1.16.6"
      opentofu-version: "1.13.9"
      test-directory: tests
      prepare-script: scripts/prepare-tests.sh
      test-override-directory: tests/overrides
